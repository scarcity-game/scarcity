name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read   # plan: find the last successful run on main

jobs:
  # Works out which modules changed and turns modules.yaml into job matrices.
  #   main: changed since the last successful run of this workflow on main, i.e.
  #         the last successful deploy. So a module whose earlier deploy failed
  #         is retried, not forgotten.
  #   PR:   changed since the merge base.
  # A change to modules.yaml or this workflow selects every module, as does a
  # missing or unknown base.
  plan:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.select.outputs.modules }}
      deployables: ${{ steps.select.outputs.deployables }}
      all_deployables: ${{ steps.select.outputs.all_deployables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the Java Dockerfiles share one dependency stage
        run: config/docker/maven-deps.py
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml \
              --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha // empty')
          fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "Comparing against $base"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "::notice::No usable base commit; selecting every module"
          fi
      - id: select
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          all=false
          if [ -z "$BASE" ]; then
            all=true
            changed=""
          else
            changed=$(git diff --name-only "$BASE" HEAD)
          fi
          if printf '%s\n' "$changed" | grep -qxE 'modules\.yaml|\.github/workflows/ci\.yaml'; then
            all=true
          fi
          echo "Changed files:"
          printf '  %s\n' $changed

          selected=$(yq -o=json -I=0 '.modules' modules.yaml | jq -c --arg all "$all" --arg changed "$changed" '
            ($changed | split("\n") | map(select(length > 0))) as $files
            | map(select(
                $all == "true" or
                (([.path] + (.paths // [])) as $ps
                 | any($files[] as $f | $ps[] as $p | ($f == $p or ($f | startswith($p + "/"))); .))
              ))')

          echo "modules=$selected" >> "$GITHUB_OUTPUT"
          echo "deployables=$(jq -c '[.[] | select(.deploy == true)]' <<<"$selected")" >> "$GITHUB_OUTPUT"
          echo "all_deployables=$(yq -o=json -I=0 '[.modules[] | select(.deploy == true)]' modules.yaml)" >> "$GITHUB_OUTPUT"
          echo "Selected modules: $(jq -r 'map(.name) | join(", ") | if . == "" then "(none)" else . end' <<<"$selected")"

  # Builds the dependency stage every Java Dockerfile shares
  # (config/docker/README.md) into the `maven-deps` cache scope, once, before
  # the image builds and the acceptance tests' stack read it. Without it each
  # build downloads every dependency from Maven Central in parallel whenever a
  # pom changes, and Central answers 429.
  deps:
    needs: plan
    if: >-
      ${{ contains(needs.plan.outputs.deployables, '"toolchain":"java"')
          || contains(needs.plan.outputs.modules, '"name":"web-acceptance-tests"') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: config/docker/maven-deps.Dockerfile
          outputs: type=cacheonly
          cache-from: type=gha,scope=maven-deps
          cache-to: type=gha,mode=max,scope=maven-deps

  # Fills the Maven cache once, before the Java test jobs, which only restore
  # it. With setup-java's own `cache: maven` every job shared one key and the
  # first to finish saved it, holding just its module's dependencies; the
  # others downloaded the rest from Central in parallel (429s, spurious 404s,
  # #244). Here one job resolves what every module's `verify` needs: the whole
  # reactor through the real lifecycle (compile, lint, enforcer, surefire),
  # then libs/world-model's tests, which are what resolves surefire's JUnit
  # provider (it is fetched only when a test runs; the other modules use the
  # same one). Saved only on an exact-key miss.
  maven-cache:
    needs: plan
    if: ${{ contains(needs.plan.outputs.modules, '"toolchain":"java"') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: maven-${{ runner.os }}-
      - if: steps.restore.outputs.cache-hit != 'true'
        name: resolve everything verify needs
        run: |
          mvn -B -ntp verify -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
          mvn -B -ntp -q -pl libs/world-model -am verify
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.restore.outputs.cache-primary-key }}

  test:
    # After deps only for the order (the acceptance tests build images); a
    # failed deps or maven-cache fails the run through the ci job, not the
    # tests (a Java job then just downloads what it lacks).
    needs: [plan, deps, maven-cache]
    if: ${{ !cancelled() && needs.plan.outputs.modules != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    name: test ${{ matrix.module.name }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.module.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - if: matrix.module.toolchain == 'java'
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: maven-${{ runner.os }}-
      - if: matrix.module.toolchain == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.module.path }}/package-lock.json
      # The acceptance tests build their stack's images (#144): a buildx builder
      # and the Actions runtime token let compose use the GitHub Actions cache
      # (clients/web-acceptance-tests/stack/compose.cache-gha.yaml).
      - if: matrix.module.name == 'web-acceptance-tests'
        uses: docker/setup-buildx-action@v3
      - if: matrix.module.name == 'web-acceptance-tests'
        uses: crazy-max/ghaction-github-runtime@v3
      - name: test
        working-directory: ${{ matrix.module.path }}
        env:
          E2E_BUILD_CACHE: ${{ matrix.module.name == 'web-acceptance-tests' && 'gha' || '' }}
        run: ${{ matrix.module.test }}
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module.name }}
          path: |
            ${{ matrix.module.path }}/test-results/
            ${{ matrix.module.path }}/playwright-report/
            ${{ matrix.module.path }}/target/surefire-reports/
          if-no-files-found: ignore

  image:
    needs: [plan, deps, test]
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' && needs.deps.result != 'failure'
          && needs.plan.outputs.deployables != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.deployables) }}
    name: image ${{ matrix.module.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module.context }}
          file: ${{ matrix.module.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ matrix.module.image }}:sha-${{ github.sha }}
            ${{ matrix.module.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.module.name }}
            type=gha,scope=maven-deps
          cache-to: type=gha,mode=max,scope=${{ matrix.module.name }}

  # Static diff of the rendered k8s manifests, for reviewers. It needs no
  # cluster and no secret: PR code never gets cluster credentials. Image
  # placeholders (`<name>-image`) are left as they are in both renders, so only
  # real manifest edits show. Output: the job summary and one sticky PR comment.
  k8s-diff:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the sticky comment; job level only
    env:
      BASE_REF: ${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.2'
      - name: render the PR head
        run: |
          kubectl kustomize k8s-resources > "$RUNNER_TEMP/head.yaml"
      - name: render the merge base
        run: |
          base=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF")
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          # No k8s-resources at the base: the base render is empty.
          if [ -d "$RUNNER_TEMP/base/k8s-resources" ]; then
            kubectl kustomize "$RUNNER_TEMP/base/k8s-resources" > "$RUNNER_TEMP/base.yaml"
          else
            : > "$RUNNER_TEMP/base.yaml"
          fi
      - name: diff into the summary
        run: |
          limit=60000
          # diff exits 1 when the files differ; only 2 is an error.
          rc=0
          diff -u --label base --label head \
            "$RUNNER_TEMP/base.yaml" "$RUNNER_TEMP/head.yaml" > "$RUNNER_TEMP/k8s.diff" || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          {
            echo '<!-- k8s-diff -->'
            echo '### Rendered k8s manifests'
            echo
            echo 'Static `kubectl kustomize k8s-resources` at the merge base vs the PR head.'
            echo 'Image placeholders (`<name>-image`) are not replaced, so only manifest edits show.'
            echo
            if [ ! -s "$RUNNER_TEMP/k8s.diff" ]; then
              echo 'No changes to rendered k8s manifests.'
            else
              echo '```diff'
              head -c "$limit" "$RUNNER_TEMP/k8s.diff"
              echo
              echo '```'
              if [ "$(wc -c < "$RUNNER_TEMP/k8s.diff")" -gt "$limit" ]; then
                echo "_Diff truncated to the first ${limit} characters; render both sides locally for the rest._"
              fi
            fi
          } > "$RUNNER_TEMP/body.md"
          # Without the hidden marker line in the summary.
          grep -v '^<!-- k8s-diff -->$' "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: sticky PR comment
        # A fork's token is read-only; those PRs rely on the summary.
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- k8s-diff -->")) | .id] | first // empty' \
            | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/body.md" > /dev/null
          fi

  # The one required status check on main (branch protection), so auto-merge
  # waits for CI. The test and image jobs exist only for the modules a change
  # touches, so none of them can be required by name. This job always runs and
  # fails if any job before it failed or was cancelled; skipped ones are fine.
  ci:
    needs: [plan, deps, maven-cache, test, image, k8s-diff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "plan, deps, maven-cache, test, image, k8s-diff: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  # Always runs on main, even when no module changed, so k8s-resources/ edits
  # still apply. Changed modules are pinned to this commit's image. Unchanged
  # ones keep the image the cluster is already running, so applying them is a
  # no-op ("unchanged") and nothing rolls.
  deploy:
    needs: [plan, deps, test, image]
    if: >-
      ${{ !cancelled()
          && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && needs.plan.result == 'success'
          && needs.deps.result != 'failure'
          && needs.test.result != 'failure'
          && needs.image.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-scarcity
    environment:
      name: production
      url: https://scarcity.pessimistic-it.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.2'
      - name: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version
      - name: pin images
        working-directory: k8s-resources
        env:
          CHANGED: ${{ needs.plan.outputs.deployables }}
          ALL: ${{ needs.plan.outputs.all_deployables }}
        run: |
          for row in $(jq -r '.[] | "\(.name)=\(.image)"' <<<"$ALL"); do
            name="${row%%=*}"
            image="${row#*=}"
            if jq -e --arg n "$name" 'any(.[]; .name == $n)' <<<"$CHANGED" > /dev/null; then
              ref="${image}:sha-${GITHUB_SHA}"
              echo "${name}: changed -> ${ref}"
            else
              ref=$(kubectl -n scarcity get "deployment/${name}" \
                -o jsonpath="{.spec.template.spec.containers[?(@.name==\"${name}\")].image}" 2>/dev/null || true)
              if [ -z "$ref" ]; then
                ref="${image}:latest"
                echo "::warning::${name} is not deployed yet and has no changes; falling back to ${ref}"
              else
                echo "${name}: unchanged -> keeping ${ref}"
              fi
            fi
            kustomize edit set image "${name}-image=${ref}"
          done
      - name: apply
        working-directory: k8s-resources
        run: |
          kubectl kustomize . | kubectl apply -f -
      - name: rollout
        env:
          ALL: ${{ needs.plan.outputs.all_deployables }}
        run: |
          for name in $(jq -r '.[].name' <<<"$ALL"); do
            kubectl -n scarcity rollout status "deployment/${name}" --timeout=5m
          done
