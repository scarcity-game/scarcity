name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Turns modules.yaml into two job matrices.
  plan:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.read.outputs.modules }}
      deployables: ${{ steps.read.outputs.deployables }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "modules=$(yq -o=json -I=0 '.modules' modules.yaml)" >> "$GITHUB_OUTPUT"
          echo "deployables=$(yq -o=json -I=0 '[.modules[] | select(.deploy == true)]' modules.yaml)" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    name: test ${{ matrix.module.name }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.module.toolchain == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - if: matrix.module.toolchain == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.module.path }}/package-lock.json
      - name: test
        working-directory: ${{ matrix.module.path }}
        run: ${{ matrix.module.test }}

  image:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.deployables) }}
    name: image ${{ matrix.module.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.module.context }}
          file: ${{ matrix.module.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.module.image }}:sha-${{ github.sha }}
            ${{ matrix.module.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module.name }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [plan, image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-scarcity
    environment:
      name: production
      url: https://scarcity.pessimistic-it.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.2'
      - name: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version
      - name: pin images
        working-directory: k8s-resources
        env:
          DEPLOYABLES: ${{ needs.plan.outputs.deployables }}
        run: |
          for row in $(echo "$DEPLOYABLES" | jq -r '.[] | "\(.name)=\(.image)"'); do
            name="${row%%=*}"
            image="${row#*=}"
            kustomize edit set image "${name}-image=${image}:sha-${GITHUB_SHA}"
          done
          kubectl kustomize .
      - name: apply
        working-directory: k8s-resources
        run: |
          kubectl kustomize . | kubectl apply -f -
      - name: rollout
        env:
          DEPLOYABLES: ${{ needs.plan.outputs.deployables }}
        run: |
          for name in $(echo "$DEPLOYABLES" | jq -r '.[].name'); do
            kubectl -n scarcity rollout status "deployment/${name}" --timeout=5m
          done
