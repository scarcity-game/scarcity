# Local end-to-end stack that mirrors production routing:
#
#   host 127.0.0.1:${E2E_PORT:-18473} -> gateway (nginx, routes like k8s-resources/platform/httproute.yaml)
#                                          /api/auth, /api/auth/... -> auth:8080
#                                          /                        -> client-web:8080
#   auth -> postgres:5432
#
# Only the gateway is published, and only on loopback. Everything here is
# throwaway: the Postgres credentials are local test values, the database lives
# on a tmpfs, and auth generates an ephemeral JWT key.
#
# Paths are relative to this file. The fixed project name keeps
# `docker compose down -v --remove-orphans` reliable from any cwd.
name: scarcity-e2e

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: scarcity
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-throwaway
    # Data on tmpfs: faster, and no volume is left behind. Mounting over the
    # image's VOLUME path (/var/lib/postgresql in 18.x) also stops Docker from
    # creating an anonymous volume.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: the entrypoint's temporary init server listens on the
      # socket only, so TCP readiness means the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "e2e", "-d", "scarcity"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth:
    build:
      context: ../../..
      dockerfile: services/auth/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: k8s
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/scarcity
      SPRING_DATASOURCE_USERNAME: e2e
      SPRING_DATASOURCE_PASSWORD: e2e-throwaway
      # AUTH_JWT_PRIVATE_KEY_PATH is deliberately unset: auth generates an
      # ephemeral key (and logs a WARN), which is what a test stack wants.
      # The service's minimum bcrypt cost (production uses 12); keeps the tests quick.
      AUTH_PASSWORD_BCRYPTSTRENGTH: "10"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The JRE image has bash but no curl/wget, so speak HTTP/1.0 over
      # /dev/tcp and require a 200 status line.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 2s
      timeout: 3s
      start_period: 120s
      retries: 60

  client-web:
    build:
      context: ../../web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    # Same image as the client's runtime stage, so it is pulled once.
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${E2E_PORT:-18473}:8080"
    depends_on:
      auth:
        condition: service_healthy
      client-web:
        condition: service_healthy
    healthcheck:
      # Through the gateway's own routes, so a routing mistake fails here.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/health &&
          wget -q -O /dev/null http://127.0.0.1:8080/api/auth/.well-known/jwks.json
      interval: 2s
      timeout: 3s
      retries: 30
