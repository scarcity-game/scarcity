# Stand-in for the Envoy Gateway + HTTPRoute in k8s-resources/platform/httproute.yaml.
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged.
#
# HTTPRoute PathPrefix matches whole path segments: /api/auth matches
# /api/auth and /api/auth/..., but not /api/authx. Hence the two locations
# below; /api/authx falls through to the client, whose nginx 404s /api/*.
# Keep this in sync with the HTTPRoute when services add public routes.
server {
    listen       8080;
    server_name  _;

    server_tokens     off;
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $http_host;

    # PathPrefix /api/auth -> auth:8080 (path passed through unchanged).
    location = /api/auth {
        proxy_pass http://auth:8080;
    }
    location /api/auth/ {
        proxy_pass http://auth:8080;
    }

    # PathPrefix / -> client-web:8080
    location / {
        proxy_pass http://client-web:8080;
    }
}
