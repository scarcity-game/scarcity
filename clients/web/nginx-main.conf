# Top-level nginx config for the web client. Installed as
# /etc/nginx/nginx.conf, replacing the one nginxinc/nginx-unprivileged ships,
# so every writable path is explicit here rather than inherited.
#
# The container runs with a read-only root filesystem. The ONLY writable path
# is /tmp (an emptyDir in k8s, `--tmpfs /tmp` with docker). Everything nginx
# writes must live under /tmp; nothing may write under /etc/nginx or
# /var/cache/nginx. Logs go to stdout/stderr (/var/log/nginx/*.log are
# symlinks to /dev/stdout and /dev/stderr in the base image).
#
# Our server block is conf.d/default.conf (nginx.conf in this repo).

# One worker, set statically. The pod is limited to 200m CPU and 64Mi memory:
# a fifth of a core can't keep more than one worker busy, and each extra
# worker costs memory. Static so no entrypoint script has to rewrite this file
# at startup (the base image's 30-tune-worker-processes.sh did that, which
# fails on a read-only root). Raise it together with the CPU limit.
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    # Temp paths default to /var/cache/nginx/*_temp (compiled in) and nginx
    # creates them at startup, so all five must point under /tmp. Only
    # client_body is reachable today (we don't proxy, or speak
    # fastcgi/uwsgi/scgi), but every one is set so none falls back.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    # No proxy_cache / fastcgi_cache etc. is configured, so there is no cache
    # directory. Any future *_cache_path must also go under /tmp.

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Same format as the base image's "main".
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
