# Server block for the web client. Installed as /etc/nginx/conf.d/default.conf
# in nginxinc/nginx-unprivileged (runs as uid 101, so it must listen >1024).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    server_tokens     off;
    # Redirects (if any) stay relative, so they work behind the Gateway.
    absolute_redirect off;

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # k8s readiness/liveness probe.
    location = /health {
        access_log   off;
        default_type text/plain;
        return       200 "ok";
    }

    # /api/* is routed to the services by the Gateway. If a request reaches
    # this container anyway, 404 rather than serving the SPA as HTML.
    location = /api {
        return 404;
    }
    location /api/ {
        return 404;
    }
    # Same for /otlp/* (browser traces, routed by the Gateway to the
    # collector): a misrouted export gets a plain 404, not the SPA.
    location = /otlp {
        return 404;
    }
    location /otlp/ {
        return 404;
    }

    # Vite's content-hashed build output: safe to cache forever.
    # Missing files 404 instead of falling back to index.html.
    location /assets/ {
        try_files  $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA entry point must always be revalidated so new deploys are picked
    # up. Fallback requests below are internally redirected here too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
