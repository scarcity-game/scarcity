# Security headers, included from nginx.conf. nginx does not inherit
# add_header into a location that sets its own, so every location that sets
# a header (Cache-Control) includes this file too.
#
# CSP: the SPA is same-origin only. Vite emits external scripts and one CSS
# file (no inline script or style element). React sets style properties through
# the CSSOM, which style-src does not block. index.html has a data: favicon,
# hence img-src data:. connect-src 'self' covers fetch, the /otlp POST and
# same-origin ws/wss (CSP3).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
