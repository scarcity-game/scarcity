apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: auth-image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/scarcity
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: AUTH_JWT_PRIVATE_KEY_PATH
              value: /etc/auth-jwt/private.pem
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          volumeMounts:
            - name: auth-jwt
              mountPath: /etc/auth-jwt
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 20m
            limits:
              memory: 512Mi
              cpu: 1000m
          startupProbe:
            httpGet:
              port: 8080
              path: /actuator/health
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/readiness
          livenessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/liveness
      volumes:
        - name: auth-jwt
          secret:
            secretName: auth-jwt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
