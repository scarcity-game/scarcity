apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        # Scraped by Prometheus job app-pods on the container port named `metrics`.
        prometheus.io/path: /actuator/prometheus
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-example-image-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: auth-image
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            # Actuator (health, prometheus). Not in the Service, not routed publicly.
            - name: metrics
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/scarcity
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: AUTH_JWT_PRIVATE_KEY_PATH
              value: /etc/auth-jwt/private.pem
            # Tracing: OTLP/HTTP to the cluster collector (Alloy). Leave the
            # endpoint unset to disable export; never set it to "".
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: http://alloy.observability.svc:4318/v1/traces
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)
          volumeMounts:
            - name: auth-jwt
              mountPath: /etc/auth-jwt
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 20m
            limits:
              memory: 512Mi
              cpu: 1000m
          startupProbe:
            httpGet:
              port: metrics
              path: /actuator/health
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              port: metrics
              path: /actuator/health/readiness
          livenessProbe:
            httpGet:
              port: metrics
              path: /actuator/health/liveness
      volumes:
        - name: auth-jwt
          secret:
            secretName: auth-jwt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
