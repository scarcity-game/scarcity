# scarcity.pessimistic-it.com on the Envoy Gateway. The listener (https-scarcity)
# and its Let's Encrypt cert are owned by AndreasChristianson/k8s-resources (#115).
# Gateway API picks the longest matching prefix, so service rules can be listed
# in any order. A module with a public HTTP API adds its rule here.
# WebSocket rules must set `timeouts: {request: 0s}` (Envoy's default is 15s).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scarcity
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: glowbox
      namespace: envoy-gateway-system
      sectionName: https-scarcity
  hostnames:
    - scarcity.pessimistic-it.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
      backendRefs:
        - name: auth
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/world
      backendRefs:
        - name: world
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: client-web
          port: 8080
