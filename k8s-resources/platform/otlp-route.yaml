# Browser traces: the web client POSTs OTLP/HTTP to /otlp/v1/traces (same
# origin, so no CORS). This route rewrites /otlp/... to /... and sends it to
# the cluster's Alloy collector in namespace `observability`.
# The k8s agent owns ReferenceGrant observability/scarcity-browser-otlp, which
# allows the cross-namespace backendRef. See issue #18.
# The route is separate from `scarcity` so its rate limit applies only here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scarcity-otlp
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: glowbox
      namespace: envoy-gateway-system
      sectionName: https-scarcity
  hostnames:
    - scarcity.pessimistic-it.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /otlp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: alloy
          namespace: observability
          port: 4318
---
# Unauthenticated public endpoint, so cap it. The local limit is shared by all
# clients: if it is hit, browser traces get dropped (429), and the rest of the
# app is unaffected.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: scarcity-otlp-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: scarcity-otlp
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 600
            unit: Minute
