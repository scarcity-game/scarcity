# Nightly logical dump of the `scarcity` database to glowbox's db-dumps export.
# The nas-db-dumps StorageClass maps this PVC to db-dumps/scarcity, and homelab
# syncs it to s3://pessimistic-it-k8s-volume-backup/db-dumps at 06:25 host time.
# One fixed filename (S3 keeps 7 days of versions), temp file + rename.
# The schedule slot (06:00) was assigned by the k8s agent; don't move it without asking.
#
# Restore (scale services to 0 first):
#   gunzip -c scarcity.sql.gz \
#     | kubectl -n scarcity exec -i postgres-0 -- psql -U scarcity -d scarcity
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-dumps
spec:
  storageClassName: nas-db-dumps
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 6 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          containers:
            - name: pg-dump
              image: postgres:18.6
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 256Mi
                  cpu: 200m
              env:
                - name: PGHOST
                  value: postgres-service
                - name: PGDATABASE
                  value: scarcity
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secrets
                      key: password
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  dir=/dumps
                  pg_dump --no-owner --clean --if-exists | gzip > "$dir/.scarcity.sql.gz.tmp"
                  mv "$dir/.scarcity.sql.gz.tmp" "$dir/scarcity.sql.gz"
                  ls -l "$dir"
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: db-dumps
