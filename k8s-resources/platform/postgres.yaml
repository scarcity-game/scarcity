# Shared Postgres for the namespace. Each service owns a schema named after
# itself (Flyway-managed) inside the `scarcity` database.
# StatefulSet so a rollout never runs two postmasters against one PGDATA.
# postgres:18 keeps data in /var/lib/postgresql/<major>/docker, so the PVC is
# mounted at /var/lib/postgresql.
# Credentials: secret `postgres-secrets` (username, password), created by hand
# by the k8s agent, never committed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6
          # jit=off: the resource store's queries cost more than
          # jit_above_cost, so every call JIT-compiled (~170 ms for a ~7 ms
          # query). See docs/decisions.md, 2026-11-26.
          # Memory: `resources` is ~3 GB and `area_log` ~4.5 GB on NFS, so
          # a bigger cache saves most reads (the default 128MB held little of
          # it). shared_buffers is about a quarter of the limit; the kernel's
          # page cache, charged to the pod, is the rest of
          # effective_cache_size. See docs/decisions.md, 2026-11-27.
          args:
            - "-c"
            - "jit=off"
            - "-c"
            - "shared_buffers=768MB"
            - "-c"
            - "effective_cache_size=2GB"
            - "-c"
            - "work_mem=16MB"
            - "-c"
            - "maintenance_work_mem=256MB"
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 1Gi
              cpu: 400m
            limits:
              memory: 3Gi
              cpu: 2000m
          env:
            - name: POSTGRES_DB
              value: scarcity
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d scarcity']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d scarcity']
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            # Parallel queries share memory through /dev/shm, which a pod
            # otherwise gets only 64MB of.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: nas-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
