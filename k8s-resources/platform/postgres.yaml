# Shared Postgres for the namespace. Each service owns a schema named after
# itself (Flyway-managed) inside the `scarcity` database.
# StatefulSet so a rollout never runs two postmasters against one PGDATA.
# postgres:18 keeps data in /var/lib/postgresql/<major>/docker, so the PVC is
# mounted at /var/lib/postgresql.
# Credentials: secret `postgres-secrets` (username, password), created by hand
# by the k8s agent, never committed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 128Mi
              cpu: 20m
            limits:
              memory: 512Mi
              cpu: 500m
          env:
            - name: POSTGRES_DB
              value: scarcity
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d scarcity']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d scarcity']
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: nas-nfs
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres
