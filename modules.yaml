# Module registry. CI reads this file (with yq) to decide what to build, test,
# containerise and deploy. Add your module here; see k8s-resources/README.md.
#
# Fields:
#   name        unique, kebab-case. Also the k8s Deployment/Service name and the
#               kustomize image placeholder "<name>-image".
#   kind        service | library | content | client | test
#   path        module directory
#   paths       (optional) extra paths whose changes also rebuild this module,
#               e.g. the root pom.xml for Java modules, or a library it uses.
#               A path matches itself and everything under it.
#   toolchain   java | node        (selects CI setup)
#   test        command run from the module path in CI
#   deploy      true if the module ships a container to the cluster
#   dockerfile  (deploy only) path to the Dockerfile, relative to repo root
#   context     (deploy only) docker build context, relative to repo root
#   image       (deploy only) the image is pushed here, tagged sha-<git sha> and latest
#
# Change detection (see .github/workflows/ci.yaml):
#   CI only tests, builds and rolls out modules with a changed file under `path`
#   or `paths`. On main, "changed" means changed since the last successful
#   deploy. On a PR, it means changed since the merge base. A change to
#   modules.yaml or the CI workflow itself rebuilds everything. Unchanged
#   deployed modules keep the image currently running in the cluster.

modules:
  - name: auth
    kind: service
    path: services/auth
    paths: [pom.xml, .mvn, config/lint]
    toolchain: java
    test: mvn -B -f ../../pom.xml -pl services/auth -am verify
    deploy: true
    dockerfile: services/auth/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-auth

  - name: client-web
    kind: client
    path: clients/web
    toolchain: node
    test: npm ci && npm test && npm run build
    deploy: true
    dockerfile: clients/web/Dockerfile
    context: clients/web
    image: ghcr.io/scarcity-game/scarcity-client-web

  # End-to-end Playwright tests: builds auth + client-web from source, runs them
  # behind an nginx gateway that mirrors the HTTPRoute, and drives a browser.
  # Not deployed; a failure here blocks the deploy like any other test.
  - name: web-acceptance-tests
    kind: test
    path: clients/web-acceptance-tests
    paths: [clients/web, services/auth, pom.xml, .dockerignore, k8s-resources/platform/httproute.yaml]
    toolchain: node
    test: npm ci && npm test
    deploy: false

  - name: resource-model
    kind: library
    path: libs/resource-model
    paths: [pom.xml, .mvn, config/lint]
    toolchain: java
    test: mvn -B -f ../../pom.xml -pl libs/resource-model -am verify
    deploy: false

  - name: world
    kind: service
    path: services/world
    paths: [pom.xml, .mvn, config/lint, libs/resource-model]
    toolchain: java
    test: mvn -B -f ../../pom.xml -pl services/world -am verify
    deploy: true
    dockerfile: services/world/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-world

  - name: subscriptions
    kind: service
    path: services/subscriptions
    paths: [pom.xml, .mvn, config/lint, libs/resource-model]
    toolchain: java
    test: mvn -B -f ../../pom.xml -pl services/subscriptions -am verify
    deploy: true
    dockerfile: services/subscriptions/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-subscriptions
