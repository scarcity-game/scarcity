# Module registry. CI reads this file (with yq) to decide what to build, test,
# containerise and deploy. Add your module here; see k8s-resources/README.md.
#
# Fields:
#   name        unique, kebab-case. Also the k8s Deployment/Service name and the
#               kustomize image placeholder "<name>-image".
#   kind        service | library | content | client | test
#   path        module directory
#   paths       (optional) extra paths whose changes also rebuild this module,
#               e.g. the root pom.xml for Java modules, or a library it uses.
#               A path matches itself and everything under it.
#   toolchain   java | node        (selects CI setup)
#   test        command run from the module path in CI. A Java module with in-repo
#               dependencies runs two steps: `-am install` with no tests and no
#               lint (upstream modules are tested in their own jobs; the
#               services-it profiles need skipTests unset, hence -Dtest=NoSuchTest),
#               then `verify` of the module alone against what was installed.
#   deploy      true if the module ships a container to the cluster
#   dockerfile  (deploy only) path to the Dockerfile, relative to repo root
#   context     (deploy only) docker build context, relative to repo root
#   image       (deploy only) the image is pushed here, tagged sha-<git sha> and latest
#
# Change detection (see .github/workflows/ci.yaml):
#   CI only tests, builds and rolls out modules with a changed file under `path`
#   or `paths`. On main, "changed" means changed since the last successful
#   deploy. On a PR, it means changed since the merge base. A change to
#   modules.yaml or the CI workflow itself rebuilds everything. Unchanged
#   deployed modules keep the image currently running in the cluster.

modules:
  - name: auth
    kind: service
    path: services/auth
    paths: [pom.xml, .mvn, config/lint, libs/observability]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/auth -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/auth verify
    deploy: true
    dockerfile: services/auth/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-auth

  - name: client-web
    kind: client
    path: clients/web
    # The client bundles the sprites (#208): a new sprite rebuilds, tests and redeploys it.
    # Its checksum test reads the server's vectors (#186), so a change there tests it again.
    paths: [content/sprites, libs/resource-model/src/test/resources/golden/version-checksums.json]
    toolchain: node
    test: npm ci && npm run lint && npm test && npm run build
    deploy: true
    dockerfile: clients/web/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-client-web

  # End-to-end Playwright tests: builds auth + client-web from source, runs them
  # behind an nginx gateway that mirrors the HTTPRoute, and drives a browser.
  # Not deployed; a failure here blocks the deploy like any other test.
  - name: web-acceptance-tests
    kind: test
    path: clients/web-acceptance-tests
    paths: [clients/web, content/sprites, services/auth, pom.xml, .dockerignore, k8s-resources/platform/httproute.yaml, libs/observability]
    toolchain: node
    test: npm ci && npm test
    deploy: false

  # Tracing, metrics and semconv span attributes for every Java service (Spring auto-configuration).
  - name: observability
    kind: library
    path: libs/observability
    paths: [pom.xml, .mvn, config/lint]
    toolchain: java
    test: mvn -B -ntp -q -f ../../pom.xml -pl libs/observability -am verify
    deploy: false

  - name: resource-model
    kind: library
    path: libs/resource-model
    paths: [pom.xml, .mvn, config/lint]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/resource-model -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/resource-model verify
    deploy: false

  # Typed game state and its JSON mapping. Pure Java (Jackson only), no Docker in tests.
  - name: world-model
    kind: library
    path: libs/world-model
    paths: [pom.xml, .mvn, config/lint]
    toolchain: java
    test: mvn -B -ntp -q -f ../../pom.xml -pl libs/world-model -am verify
    deploy: false

  # The advance: events, effects and log entries in memory. Pure (world-model only), no Docker in tests.
  - name: world-engine
    kind: library
    path: libs/world-engine
    paths: [pom.xml, .mvn, config/lint, libs/world-model]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-engine -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-engine verify
    deploy: false

  # Generated area layouts (#234, #310): a cell graph, tessellations and generators. Pure (world-model only).
  - name: world-gen
    kind: library
    path: libs/world-gen
    paths: [pom.xml, .mvn, config/lint, libs/world-model]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-gen -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-gen verify
    deploy: false

  # Paths of straight legs around an area's obstacles, for controllers (#237). Pure (world-model only).
  - name: pathfinding
    kind: library
    path: libs/pathfinding
    paths: [pom.xml, .mvn, config/lint, libs/world-model, libs/world-gen]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/pathfinding -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/pathfinding verify
    deploy: false

  # The fighting rules (strike and its draws), added to the catalogue (#451). Pure: world-model;
  # tests run strikes through world-engine.
  - name: combat
    kind: library
    path: libs/combat
    paths: [pom.xml, .mvn, config/lint, libs/world-model, libs/world-engine, libs/combat]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/combat -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/combat verify
    deploy: false

  # Loads an area and commits an advance (resources, batch, area log, lock). Testcontainers;
  # its tables are services/world's migrations, so those rebuild it too.
  - name: world-db
    kind: library
    path: libs/world-db
    paths: [pom.xml, .mvn, config/lint, libs/resource-model, libs/world-model, libs/world-engine, services/world/src/main/resources/db/migration]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-db -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-db verify
    deploy: false

  - name: world-seed
    kind: library
    path: libs/world-seed
    paths: [pom.xml, .mvn, config/lint, libs/resource-model, libs/world-model, libs/world-gen, services/world/src/main/resources/db/migration]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-seed -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/world-seed verify
    deploy: false

  # What a service that plays entities shares: its token, world's API, the subscriptions socket,
  # its turns and the weighted draw of its choices. Its test-jar has the stubs the services test with.
  - name: service-controller
    kind: library
    path: libs/service-controller
    paths: [pom.xml, .mvn, config/lint, libs/world-model]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl libs/service-controller -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl libs/service-controller verify
    deploy: false

  - name: world
    kind: service
    path: services/world
    paths: [pom.xml, .mvn, config/lint, libs/resource-model, libs/world-model, libs/combat, libs/world-engine, libs/world-db, libs/world-seed, libs/world-gen, libs/observability]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/world -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/world verify
    deploy: true
    dockerfile: services/world/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-world

  - name: subscriptions
    kind: service
    path: services/subscriptions
    paths: [pom.xml, .mvn, config/lint, libs/resource-model, libs/observability]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/subscriptions -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/subscriptions verify
    deploy: true
    dockerfile: services/subscriptions/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-subscriptions

  # Plays the test area's orbiter through world's intents API.
  - name: orbital
    kind: service
    path: services/orbital
    paths: [pom.xml, .mvn, config/lint, libs/observability, libs/service-controller, libs/world-model]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/orbital -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/orbital verify
    deploy: true
    dockerfile: services/orbital/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-orbital

  # Plays the mice in every area: an intelligence service, world POSTs it each mouse's turn.
  - name: microbe
    kind: service
    path: services/microbe
    paths: [pom.xml, .mvn, config/lint, libs/observability, libs/service-controller, libs/world-model]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/microbe -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/microbe verify
    deploy: true
    dockerfile: services/microbe/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-microbe

  # Plays the diver, the npc that always goes down (#171), told its turns by subscriptions' turn
  # feed. Its integration test runs world's, subscriptions' and microbe's jars on the dive game.
  - name: diver
    kind: service
    path: services/diver
    paths: [pom.xml, .mvn, config/lint, libs/observability, libs/service-controller, libs/pathfinding, libs/resource-model, libs/world-model, libs/combat, libs/world-engine, libs/world-db, libs/world-seed, libs/world-gen, services/auth, services/world, services/subscriptions, services/microbe]
    toolchain: java
    test: |
      mvn -B -ntp -q -f ../../pom.xml -pl services/diver -am install -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dcheckstyle.skip -Dpmd.skip
      mvn -B -ntp -q -f ../../pom.xml -pl services/diver verify
    deploy: true
    dockerfile: services/diver/Dockerfile
    context: .
    image: ghcr.io/scarcity-game/scarcity-diver

  # SVG sprites by category and variant (#207). Its test also fails when a prototype in the
  # model or the seed has no variant, so a new prototype needs a sprite before it merges, and when
  # a material in the materials catalogue names a pattern it lacks.
  - name: sprites
    kind: content
    path: content/sprites
    paths: [libs/world-model/src/main/resources/prototypes, libs/world-model/src/main/resources/materials.json, libs/world-seed/src/main/resources/seed]
    toolchain: node
    test: npm ci && npm test
    deploy: false
