spring:
  application:
    name: scarcity-auth
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  datasource:
    # Local-dev defaults; k8s overrides via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    url: jdbc:postgresql://localhost:5432/scarcity
    username: scarcity
    password: scarcity
  flyway:
    schemas: auth
    default-schema: auth
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
    servlet:
      # Initialise DispatcherServlet at startup rather than on the first request.
      load-on-startup: 1

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

auth:
  jwt:
    # PKCS#8 PEM RSA private key. Blank -> ephemeral key (dev/test only, logs a WARN).
    private-key-path: ${AUTH_JWT_PRIVATE_KEY_PATH:}
    ttl: 1h
  service-token:
    # Service principals' API keys: one file per principal (name = principal, content = key),
    # the k8s secret `service-api-keys` mounted as a volume. Blank: no keys, every exchange is a 401.
    keys-dir: ${AUTH_SERVICE_KEYS_DIR:}
    # Lifetime of a service token; services renew at about 2/3 of it.
    ttl: 15m
  unavailable:
    # Retry-After on the 503 returned while Postgres cannot be reached.
    retry-after: 5s
  password:
    # bcrypt cost factor; must be >= 10.
    bcrypt-strength: 12

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: auth
