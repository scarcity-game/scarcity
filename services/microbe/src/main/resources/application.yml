spring:
  application:
    name: scarcity-microbe
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  web:
    error:
      whitelabel:
        enabled: false

server:
  # POST /turn (world's calls) is served here.
  port: 8080

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: microbe

# libs/service-controller: who microbe is, how it draws. An intelligence service: it holds no socket and
# calls nobody; world POSTs it each turn (docs/actions.md, "Intelligence services").
controller:
  mode: endpoint
  # The controller of the mice: {"kind":"service","principal":"microbe"}; also its metrics' prefix.
  principal: microbe
  # auth's keys, to verify world's token (kind=service, sub=world). k8s: http://auth:8080/api/auth/.well-known/jwks.json
  jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/api/auth/.well-known/jwks.json}
  # Seed of the draws. Blank: a random seed, logged at startup. Replicas should not share one.
  seed: ${MICROBE_SEED:}
  # How likely each choice is, among the mouse's `actions`; 0 = never.
  weights:
    step: 3.0
    wait: 1.0

microbe:
  # step: `distance` in a uniformly drawn direction, kept inside the area.
  step:
    distance: 1.0
  wait:
    duration: 1.0
