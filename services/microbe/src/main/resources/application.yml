spring:
  application:
    name: scarcity-microbe
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  http:
    clients:
      # Calls to auth and world. A turn never waits longer than this for one response.
      connect-timeout: 2s
      read-timeout: 10s
  web:
    error:
      whitelabel:
        enabled: false

server:
  # Nothing is served here; it listens because every HTTP service does.
  port: 8080

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: microbe

# libs/service-controller: who microbe is, where the services are, how it draws.
controller:
  # The controller of the mice: {"kind":"service","principal":"microbe"}; also its metrics' prefix.
  principal: microbe
  # auth's base URL, for the service token. k8s: http://auth:8080
  auth-url: ${AUTH_URL:http://localhost:8080}
  # microbe's key in auth's secret service-api-keys. Required; never logged.
  api-key: ${MICROBE_API_KEY:}
  # world's base URL. k8s: http://world:8080
  world-url: ${WORLD_URL:http://localhost:8080}
  # The subscriptions WebSocket. k8s: ws://subscriptions:8080/api/subscriptions/ws
  subscriptions-url: ${SUBSCRIPTIONS_URL:ws://localhost:8080/api/subscriptions/ws}
  # No area: the turn feed, so microbe plays its mice in every area, levels made later included.
  area:
  # No wall-clock pause (#170): an arrival waits for the mice, so they decide at once.
  think: ${MICROBE_THINK:0s}
  # The WebSocket's reconnect wait: doubles from reconnect up to reconnect-max.
  reconnect: 1s
  reconnect-max: 30s
  # Nothing heard for this long (subscriptions pings every 30 s): reconnect.
  silence: 90s
  # Seed of the draws. Blank: a random seed, logged at startup.
  seed: ${MICROBE_SEED:}
  # How likely each choice is, among the mouse's `actions`; 0 = never.
  weights:
    step: 3.0
    wait: 1.0

microbe:
  # step: `distance` in a uniformly drawn direction, kept inside the area.
  step:
    distance: 1.0
  wait:
    duration: 1.0
