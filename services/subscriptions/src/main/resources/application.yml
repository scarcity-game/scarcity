spring:
  application:
    name: scarcity-subscriptions
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  datasource:
    # Local-dev defaults; k8s overrides via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    # Only used for the LISTEN connection and the readiness check: no schema, no Flyway.
    url: jdbc:postgresql://localhost:5432/scarcity
    username: scarcity
    password: scarcity
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  web:
    error:
      whitelabel:
        enabled: false

server:
  port: 8080

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,changeListener

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: subscriptions
  resource-changes:
    listen: true
  subscriptions:
    # world's resource API, called with the subscribing user's JWT.
    world-url: ${WORLD_URL:http://localhost:8080}
    # auth's public keys. Fetched lazily on the first token, so startup doesn't need auth.
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8080/api/auth/.well-known/jwks.json}
    jwt-issuer: scarcity-auth
    auth-timeout: 5s
    # how often each socket gets a checksum; a controller's failed turn is played again on the next one
    checksum-interval: ${SUBSCRIPTIONS_CHECKSUM_INTERVAL:30s}
    ping-interval: 30s
    # timeouts for calls to world (a subscribe blocks its socket thread meanwhile)
    world-connect-timeout: 3s
    world-read-timeout: 10s
