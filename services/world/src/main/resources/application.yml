spring:
  application:
    name: scarcity-world
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  datasource:
    # Local-dev defaults; k8s overrides via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    url: jdbc:postgresql://localhost:5432/scarcity
    username: scarcity
    password: scarcity
    hikari:
      # The library's `resources` table is unqualified: it lives in this service's schema.
      schema: world
  flyway:
    schemas: world
    default-schema: world
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
    servlet:
      load-on-startup: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth's public keys. Fetched lazily on the first token, so startup doesn't need auth.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/api/auth/.well-known/jwks.json}

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: world
  resource-api:
    prefix: /api/world/resources
  world:
    # The area log (docs/log.md).
    log:
      # An advance writes a snapshot when the last one is older than this (wall time).
      snapshot-interval-minutes: 60
      # Entries before the newest snapshot older than this are deleted.
      retention-hours: 24
    # Expected JWT issuer (auth's `iss`).
    jwt-issuer: scarcity-auth
    # Service principals' API keys: one file per principal (name = principal, content = key),
    # the k8s secret `world-api-keys` mounted as a volume. Blank: no keys, every X-Api-Key is a 401.
    api-keys-dir: ${SCARCITY_WORLD_API_KEYS_DIR:}
    # A rejected X-Api-Key is logged at most this often (the rest are counted).
    api-key-rejection-log-interval: 10s
