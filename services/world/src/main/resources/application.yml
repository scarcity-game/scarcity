spring:
  application:
    name: scarcity-world
  config:
    # Tracing, trace-correlated logs, metrics and the management port.
    import: classpath:scarcity-observability.yml
  datasource:
    # Local-dev defaults; k8s overrides via SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
    url: jdbc:postgresql://localhost:5432/scarcity
    username: scarcity
    password: scarcity
    hikari:
      # The library's `resources` table is unqualified: it lives in this service's schema.
      schema: world
  flyway:
    schemas: world
    default-schema: world
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true
    servlet:
      load-on-startup: 1
  security:
    oauth2:
      resourceserver:
        jwt:
          # auth's public keys. Fetched lazily on the first token, so startup doesn't need auth.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/api/auth/.well-known/jwks.json}
  web:
    error:
      whitelabel:
        enabled: false

server:
  port: 8080

management:
  # Port 8081, exposure (health, prometheus): see scarcity-observability.yml (libs/observability).
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

scarcity:
  observability:
    # OTel service.name, ECS service.name and the `application` metric tag.
    service-name: world
  resource-api:
    prefix: /api/world/resources
  world:
    # The area log (docs/log.md).
    log:
      # An advance writes a snapshot when the last one is older than this (wall time).
      snapshot-interval-minutes: 60
      # Entries before the newest snapshot older than this are deleted.
      retention-hours: 24
    # Expected JWT issuer (auth's `iss`).
    jwt-issuer: scarcity-auth
world:
  # Intelligence services (docs/actions.md, "Intelligence services"; #373). The registry maps a
  # service principal to its base URL and the range (metres) of the context its turns carry; a
  # principal not in it gets `turn` frames. Empty here: k8s registers microbe through env
  # (WORLD_INTELLIGENCE_SERVICES_MICROBE_BASEURL, ..._RANGE).
  intelligence:
    services: {}
    # Where world exchanges its key for its service token (sub=world). Needed once a service is
    # registered.
    auth-url: ${AUTH_URL:http://localhost:8080}
    api-key: ${WORLD_API_KEY:}
    # Turns dispatched at once, the longest wait for an answer, and how long a claimed turn is
    # hidden from other world pods (more than timeout).
    workers: 8
    timeout: 5s
    lease: 30s
    # Due turns are looked for after every commit that writes one, and every poll.
    poll: 1s
    # A failed turn is retried after backoff, doubling up to backoff-max, with jitter, forever.
    backoff: 250ms
    backoff-max: 30s
    # An advance decides the turns of intelligence services inside it, going on to the next player's
    # or npc's turn (docs/actions.md, "Game time"); after this long it commits instead, and the
    # dispatcher goes on from the outbox, so no advance holds its area's lock for long.
    advance-budget: 10s
